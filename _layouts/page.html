---
layout: default
---
<div class="wrap">
  {%- if page.title and page.title != "" -%}
  <header class="page-head">
    {%- if page.kicker -%}<p class="kicker">{{ page.kicker }}</p>{%- endif -%}
    <h1 class="page-title">{{ page.title }}</h1>
    {%- if page.dek -%}<p class="page-dek">{{ page.dek }}</p>{%- endif -%}
  </header>
  {%- endif -%}
  <div class="prose prose-page">
    {{ content }}
  </div>
</div>
