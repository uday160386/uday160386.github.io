# ─────────────────────────────────────────────────────────────
#  Uday BKV — personal site
#  Custom theme (no external theme gem). Everything visual lives in
#  _layouts/, _includes/ and assets/. Content lives in the _collections.
# ─────────────────────────────────────────────────────────────

title: "Uday BKV"
description: "Engineering Lead in Singapore building production-grade AI and cloud-native systems — and writing down what I learn."
url: "https://uday160386.github.io"
baseurl: ""
lang: "en"
timezone: Asia/Singapore

author:
  name: "Uday BKV"
  role: "Engineering Lead"
  location: "Singapore"
  email: "venkata.uday24@gmail.com"
  github: "uday160386"
  linkedin: "bkvudaykumar"
  instagram: "vukclicks"
  medium: "https://medium.com/@venkata.uday24"
  avatar: "/images/aboutme/profile.jpeg"
  portrait: "/images/aboutme/profile-blur.jpg"   # profile.jpeg with a light (20%) blur


# Top navigation (order = display order)
navigation:
  - title: "Projects"
    url: /projects/
  - title: "AI Engineering"
    url: /aiengineering/
  - title: "Green Software"
    url: /greensoftware/
  - title: "Notes"
    url: /notes/
  - title: "Learning"
    url: /sparetime/


# Labels + accent for each writing stream. `key` matches collection label.
streams:
  aiengineering: { label: "AI Engineering", tone: "blue",  url: /aiengineering/ }
  greensoftware: { label: "Green Software", tone: "green", url: /greensoftware/ }
  posts:         { label: "Field Notes",    tone: "amber", url: /archive/ }
  notes:         { label: "Note",           tone: "amber", url: /notes/ }
  projects:      { label: "Project",        tone: "red",   url: /projects/ }

words_per_minute: 200

# ── Collections ────────────────────────────────────────────────
collections:
  projects:
    output: true
    permalink: /:collection/:path/
  aiengineering:
    output: true
    permalink: /:collection/:path/
  greensoftware:
    output: true
    permalink: /:collection/:path/
  notes:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope: { path: "" }
    values: { layout: page }
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: projects }
    values: { layout: post }
  - scope: { path: "", type: aiengineering }
    values: { layout: post }
  - scope: { path: "", type: greensoftware }
    values: { layout: post }
  - scope: { path: "", type: notes }
    values: { layout: post, read_time: false }

permalink: /:categories/:title/
future: true

# ── Build ──────────────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

feed:
  collections:
    - aiengineering
    - greensoftware
    - notes

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - node_modules
  - .bundle
  - .jekyll-cache
